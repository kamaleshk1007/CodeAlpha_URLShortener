<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>URL Shortener</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f6f8; margin: 0; }
    main { max-width: 560px; margin: 80px auto; padding: 24px; background: #fff;
           border-radius: 8px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1); }
    h1 { margin-top: 0; }
    form { display: flex; gap: 8px; }
    input { flex: 1; padding: 10px; font-size: 16px; border: 1px solid #bbb; border-radius: 4px; }
    button { padding: 10px 16px; font-size: 16px; border: 0; border-radius: 4px;
             background: #2563eb; color: #fff; cursor: pointer; }
    button:hover { background: #1d4ed8; }
    .error { color: #b91c1c; }
    #result { margin-top: 20px; }
    #short-link { margin-right: 8px; word-break: break-all; }
  </style>
</head>
<body>
  <main>
    <h1>URL Shortener</h1>
    <form id="shorten-form">
      <input type="url" id="url-input" placeholder="https://example.com/a/very/long/link" required>
      <button type="submit">Shorten</button>
    </form>

    <p id="error" class="error" hidden></p>

    <div id="result" hidden>
      <p>Your short URL:</p>
      <a id="short-link" href="#" target="_blank" rel="noopener"></a>
      <button id="copy-btn" type="button">Copy</button>
    </div>
  </main>

  <script>
    const form = document.getElementById('shorten-form');
    const input = document.getElementById('url-input');
    const errorBox = document.getElementById('error');
    const resultBox = document.getElementById('result');
    const link = document.getElementById('short-link');
    const copyBtn = document.getElementById('copy-btn');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      errorBox.hidden = true;
      resultBox.hidden = true;

      try {
        const response = await fetch('/api/shorten', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url: input.value.trim() })
        });
        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.error || 'Something went wrong');
        }
        link.href = data.shortUrl;
        link.textContent = data.shortUrl;
        resultBox.hidden = false;
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.hidden = false;
      }
    });

    copyBtn.addEventListener('click', async () => {
      await navigator.clipboard.writeText(link.textContent);
      copyBtn.textContent = 'Copied!';
      setTimeout(() => { copyBtn.textContent = 'Copy'; }, 1500);
    });
  </script>
</body>
</html>
