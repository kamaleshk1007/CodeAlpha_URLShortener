spring.application.name=CodeAlpha_URLShortener
server.port=8080

# File-based H2 database (data survives restarts)
spring.datasource.url=jdbc:h2:file:./data/urlshortener
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Let Hibernate create/update tables from our entity classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Browser database viewer at /h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
